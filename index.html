<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Boot // Rouss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    color: #0f0;
  }

  /* ===== SPLASH SCREEN ===== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle at 50% 50%, #001a00 0%, #000 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  #splash.hidden {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  /* Fondo de líneas de código que se desplazan */
  #code-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0.25;
    pointer-events: none;
  }

  .code-line {
    position: absolute;
    white-space: nowrap;
    font-size: 13px;
    color: #0f0;
    text-shadow: 0 0 6px #0f0;
    animation: scrollCode linear infinite;
  }

  @keyframes scrollCode {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-120%); }
  }

  /* Rejilla estilo hacker */
  #grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,0,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,0,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
    pointer-events: none;
  }

  /* Iconos flotantes de computadora */
  .tech-icon {
    position: absolute;
    font-size: 28px;
    color: #0f0;
    text-shadow: 0 0 12px #0f0;
    opacity: 0.5;
    animation: floatIcon 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
    50%      { transform: translateY(-25px) rotate(8deg); opacity: 0.7; }
  }

  /* Contenido central del splash */
  #splash-content {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 20px;
    width: 100%;
    max-width: 700px;
  }

  #logo {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: bold;
    letter-spacing: 6px;
    color: #0f0;
    text-shadow:
      0 0 10px #0f0,
      0 0 30px #0f0,
      0 0 60px #00ff88;
    margin-bottom: 10px;
    animation: flicker 3s infinite;
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.4; }
  }

  #subtitle {
    font-size: 13px;
    letter-spacing: 4px;
    color: #00ff88;
    opacity: 0.8;
    margin-bottom: 40px;
  }

  /* Barra de carga */
  #progress-wrap {
    width: 100%;
    height: 22px;
    border: 2px solid #0f0;
    background: rgba(0, 255, 0, 0.05);
    box-shadow: 0 0 15px rgba(0,255,0,0.5), inset 0 0 15px rgba(0,255,0,0.2);
    position: relative;
    overflow: hidden;
    margin-bottom: 18px;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #004400, #00ff88, #0f0);
    box-shadow: 0 0 20px #0f0;
    transition: width 0.2s linear;
  }

  #progress-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(0,0,0,0.25) 0px,
      rgba(0,0,0,0.25) 8px,
      transparent 8px,
      transparent 16px
    );
  }

  #progress-text {
    font-size: 14px;
    letter-spacing: 3px;
    color: #00ff88;
  }

  #loading-log {
    margin-top: 28px;
    text-align: left;
    font-size: 12px;
    color: #0a0;
    height: 90px;
    overflow: hidden;
    line-height: 1.6;
    opacity: 0.75;
  }

  /* ===== MAIN SCREEN (pre-fiesta) ===== */
  #main {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 40%, #001a0a 0%, #000 75%);
    text-align: center;
    padding: 20px;
  }

  #main.active { display: flex; }

  #grid-bg-2 {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,0,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
  }

  #terminal-box {
    position: relative;
    z-index: 5;
    border: 2px solid #0f0;
    background: rgba(0, 20, 0, 0.8);
    box-shadow: 0 0 30px rgba(0,255,0,0.4), inset 0 0 30px rgba(0,255,0,0.05);
    padding: 40px 30px;
    max-width: 650px;
    width: 100%;
    border-radius: 6px;
  }

  #terminal-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #00ff88;
    opacity: 0.7;
    margin-bottom: 25px;
    text-align: left;
  }

  #main-message {
    font-size: clamp(17px, 2.6vw, 24px);
    line-height: 1.6;
    color: #0f0;
    text-shadow: 0 0 10px #0f0, 0 0 25px rgba(0,255,0,0.6);
    margin-bottom: 35px;
  }

  #main-message .cursor {
    display: inline-block;
    width: 12px;
    background: #0f0;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  #continue-btn {
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    padding: 16px 42px;
    background: transparent;
    color: #0f0;
    border: 2px solid #0f0;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(0,255,0,0.5), inset 0 0 18px rgba(0,255,0,0.1);
    text-shadow: 0 0 8px #0f0;
    transition: all 0.25s ease;
    animation: pulseBtn 2s infinite;
  }

  @keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 18px rgba(0,255,0,0.5), inset 0 0 18px rgba(0,255,0,0.1); }
    50%      { box-shadow: 0 0 35px rgba(0,255,0,0.9), inset 0 0 28px rgba(0,255,0,0.25); }
  }

  #continue-btn:hover {
    background: #0f0;
    color: #000;
    text-shadow: none;
    transform: scale(1.05);
  }

  /* ===== PARTY SCREEN ===== */
  #party {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #2a0a3a 0%, #0a0015 60%, #000 100%);
  }

  #party.active { display: flex; }

  /* Destellos de fondo festivos */
  #party-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,0,200,0.25), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,200,255,0.25), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,220,0,0.15), transparent 50%);
    animation: glowShift 4s ease-in-out infinite alternate;
  }

  @keyframes glowShift {
    from { opacity: 0.6; transform: scale(1); }
    to   { opacity: 1; transform: scale(1.15); }
  }

  #birthday-title {
    position: relative;
    z-index: 10;
    text-align: center;
    font-size: clamp(38px, 10vw, 120px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.1;
    padding: 0 20px;
    background: linear-gradient(90deg, #ff0066, #ffcc00, #00ffcc, #ff00cc, #ff0066);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 3s linear infinite, titlePop 0.9s cubic-bezier(0.2, 1.6, 0.4, 1);
    filter: drop-shadow(0 0 25px rgba(255,0,200,0.7)) drop-shadow(0 0 50px rgba(0,200,255,0.5));
  }

  @keyframes gradientMove {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }

  @keyframes titlePop {
    0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
    70%  { transform: scale(1.12) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  #birthday-title .line2 {
    display: block;
    font-size: 0.85em;
  }

  /* Contenedor de serpentinas 3D */
  #confetti-canvas {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* Botón de reinicio */
  #reset-btn {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 10px 22px;
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 30px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  #reset-btn:hover { opacity: 1; }

  @media (max-width: 480px) {
    #terminal-box { padding: 28px 18px; }
    #progress-wrap { height: 18px; }
  }
</style>
</head>
<body>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splash">
  <div id="grid-bg"></div>
  <div id="code-bg"></div>

  <div id="splash-content">
    <div id="logo">SYSTEM.BOOT</div>
    <div id="subtitle">// INITIALIZING SECURE SHELL //</div>

    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">CARGANDO... 0%</div>

    <div id="loading-log"></div>
  </div>
</div>

<!-- ================= MAIN SCREEN ================= -->
<div id="main">
  <div id="grid-bg-2"></div>

  <div id="terminal-box">
    <div id="terminal-title">root@system:~$ ./prepare_phase.sh</div>
    <div id="main-message">
      Estás un paso más cerca de volverte un hacker real.<br>
      <span style="font-size:0.8em;opacity:0.8;">[ acceso concedido ]</span>
      <span class="cursor">&nbsp;</span>
    </div>
    <button id="continue-btn">CONTINUAR</button>
  </div>
</div>

<!-- ================= PARTY SCREEN ================= -->
<div id="party">
  <div id="party-glow"></div>
  <canvas id="confetti-canvas"></canvas>
  <h1 id="birthday-title">
    FELIZ CUMPLEAÑOS
    <span class="line2">Rouss</span>
  </h1>
  <button id="reset-btn">↻ reiniciar</button>
</div>

<script>
/* ============================================================
   1. SPLASH: GENERADOR DE LÍNEAS DE CÓDIGO DE FONDO
   ============================================================ */
(function generateCodeBackground() {
  const container = document.getElementById('code-bg');
  const snippets = [
    'function hack() {',
    '  if (access === true) {',
    'const encrypted = decrypt(data, key);',
    '#include <stdio.h>',
    'sudo rm -rf /tmp/logs',
    'while (true) { inject(); }',
    'SELECT * FROM users;',
    '0x7FFE3A2B  mov eax, ebx',
    'return firewall.breach();',
    'ssh root@10.0.0.1',
    'for (let i = 0; i < n; i++)',
    'try { bypass(); } catch(e) {}',
    'npm install --save exploit',
    'git push origin master --force',
    '01001000 01100001 01100011 01101011',
    'ping -t 127.0.0.1',
    'chmod +x ./payload.sh',
    'console.log("access granted");',
    '{\n  "token": "0x8F3A...",\n  "exp": 9999999\n}',
    'cat /etc/passwd | grep root',
    'nmap -sS 192.168.1.0/24',
    'def exploit(target):',
    '    return target.vuln()',
    'curl -X POST /api/breach',
    'if (auth) { grant(); }',
    'buffer[0x20] = 0x41;',
    'sudo apt-get install nmap',
    'key = "0xDEADBEEF"'
  ];

  for (let i = 0; i < 28; i++) {
    const line = document.createElement('div');
    line.className = 'code-line';
    line.textContent = snippets[Math.floor(Math.random() * snippets.length)];
    line.style.top = (Math.random() * 100) + '%';
    line.style.left = '0';
    line.style.animationDuration = (8 + Math.random() * 14) + 's';
    line.style.animationDelay = (-Math.random() * 20) + 's';
    line.style.fontSize = (11 + Math.random() * 5) + 'px';
    line.style.opacity = 0.3 + Math.random() * 0.6;
    container.appendChild(line);
  }

  // Iconos flotantes de tecnología
  const icons = ['💻', '🖥️', '⚙️', '🔒', '📡', '🖱️', '⌨️', '🔑', '🧑‍💻', '💾', '🛰️', '📶'];
  const splash = document.getElementById('splash');
  for (let i = 0; i < 14; i++) {
    const icon = document.createElement('div');
    icon.className = 'tech-icon';
    icon.textContent = icons[Math.floor(Math.random() * icons.length)];
    icon.style.top = (Math.random() * 100) + '%';
    icon.style.left = (Math.random() * 100) + '%';
    icon.style.animationDelay = (-Math.random() * 6) + 's';
    icon.style.fontSize = (18 + Math.random() * 22) + 'px';
    splash.appendChild(icon);
  }
})();

/* ============================================================
   2. SPLASH: BARRA DE CARGA + LOG DE TEXTO
   ============================================================ */
(function runLoadingSequence() {
  const bar = document.getElementById('progress-bar');
  const text = document.getElementById('progress-text');
  const log = document.getElementById('loading-log');
  const splash = document.getElementById('splash');

  const logMessages = [
    '[ OK ] Inicializando kernel seguro...',
    '[ OK ] Montando sistema de archivos cifrado...',
    '[ .. ] Escaneando puertos abiertos...',
    '[ OK ] Conexión SSH establecida.',
    '[ OK ] Descargando payloads...',
    '[ .. ] Descifrando credenciales...',
    '[ OK ] Firewall evadido con éxito.',
    '[ OK ] Inyectando scripts en memoria...',
    '[ .. ] Compilando exploits...',
    '[ OK ] Acceso root obtenido.',
    '[ OK ] Sistema listo. Bienvenido, operador.'
  ];

  let progress = 0;
  let logIndex = 0;

  const interval = setInterval(() => {
    // Incremento irregular para dar sensación real
    progress += Math.random() * 6 + 1.5;
    if (progress > 100) progress = 100;

    bar.style.width = progress + '%';
    text.textContent = 'CARGANDO... ' + Math.floor(progress) + '%';

    // Añadir líneas de log
    const targetLogCount = Math.floor((progress / 100) * logMessages.length);
    while (logIndex < targetLogCount && logIndex < logMessages.length) {
      const p = document.createElement('div');
      p.textContent = logMessages[logIndex];
      log.appendChild(p);
      logIndex++;
    }
    // Auto-scroll del log
    log.scrollTop = log.scrollHeight;

    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => {
        splash.classList.add('hidden');
        document.getElementById('main').classList.add('active');
      }, 650);
    }
  }, 120);
})();

/* ============================================================
   3. BOTÓN CONTINUAR → PANTALLA DE FIESTA
   ============================================================ */
document.getElementById('continue-btn').addEventListener('click', () => {
  const main = document.getElementById('main');
  const party = document.getElementById('party');

  main.style.transition = 'opacity 0.4s ease';
  main.style.opacity = '0';

  setTimeout(() => {
    main.classList.remove('active');
    main.style.opacity = '1';
    party.classList.add('active');
    startConfetti();
  }, 420);
});

/* ============================================================
   4. SERPENTINAS 3D EN CANVAS
   ============================================================ */
let confettiAnimationId = null;
let particles = [];
let canvas, ctx;

function startConfetti() {
  canvas = document.getElementById('confetti-canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  particles = [];
  for (let i = 0; i < 220; i++) {
    particles.push(createParticle(true));
  }

  if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
  animateConfetti();
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

const CONFETTI_COLORS = [
  '#ff0066', '#ffcc00', '#00ffcc', '#ff00cc',
  '#00aaff', '#ff6600', '#ffffff', '#a020ff',
  '#00ff66', '#ff3366'
];

function createParticle(randomY) {
  // Cada partícula es una cinta (serpentina) 3D
  return {
    x: Math.random() * canvas.width,
    y: randomY ? Math.random() * canvas.height : -30,
    // Tamaño de la cinta
    w: 6 + Math.random() * 8,
    h: 14 + Math.random() * 22,
    // Velocidad
    vx: (Math.random() - 0.5) * 2.2,
    vy: 1.5 + Math.random() * 3.5,
    // Rotación 3D simulada
    angle: Math.random() * Math.PI * 2,
    angleSpeed: (Math.random() - 0.5) * 0.15,
    // "Torsión" para efecto 3D de cinta
    twist: Math.random() * Math.PI * 2,
    twistSpeed: 0.05 + Math.random() * 0.1,
    // Balanceo lateral
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.02 + Math.random() * 0.04,
    swayAmount: 0.5 + Math.random() * 1.5,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    opacity: 0.75 + Math.random() * 0.25
  };
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // Actualizar física
    p.sway += p.swaySpeed;
    p.x += p.vx + Math.sin(p.sway) * p.swayAmount;
    p.y += p.vy;
    p.angle += p.angleSpeed;
    p.twist += p.twistSpeed;

    // Reciclar si sale de pantalla
    if (p.y > canvas.height + 60) {
      particles[i] = createParticle(false);
      continue;
    }
    if (p.x < -80) p.x = canvas.width + 60;
    if (p.x > canvas.width + 80) p.x = -60;

    // Dibujar cinta 3D
    drawRibbon(p);
  }

  confettiAnimationId = requestAnimationFrame(animateConfetti);
}

function drawRibbon(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);
  ctx.globalAlpha = p.opacity;

  // La "torsión" modula el ancho para simular rotación en 3D
  const twistScale = Math.abs(Math.cos(p.twist));
  const drawW = p.w * (0.25 + twistScale * 0.75);
  const drawH = p.h;

  // Sombra / brillo para efecto 3D
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 12;

  // Cuerpo de la cinta con gradiente para dar volumen
  const grad = ctx.createLinearGradient(-drawW, 0, drawW, 0);
  grad.addColorStop(0, p.color);
  grad.addColorStop(0.5, lighten(p.color, 40));
  grad.addColorStop(1, p.color);

  ctx.fillStyle = grad;

  // Forma de cinta ondulada
  ctx.beginPath();
  ctx.moveTo(-drawW / 2, -drawH / 2);
  ctx.quadraticCurveTo(
    drawW * 0.8, -drawH * 0.1,
    -drawW / 2, drawH / 2
  );
  ctx.quadraticCurveTo(
    -drawW * 0.8, drawH * 0.1,
    -drawW / 2, -drawH / 2
  );
  ctx.closePath();
  ctx.fill();

  // Brillo superior
  ctx.globalAlpha = p.opacity * 0.35;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(
    -drawW * 0.15,
    -drawH * 0.2,
    drawW * 0.25,
    drawH * 0.25,
    p.twist,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.restore();
}

// Aclarar un color hex
function lighten(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.min(255, r);
  g = Math.min(255, g);
  b = Math.min(255, b);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/* ============================================================
   5. BOTÓN REINICIAR
   ============================================================ */
document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('party').classList.remove('active');
  if (confettiAnimationId) {
    cancelAnimationFrame(confettiAnimationId);
    confettiAnimationId = null;
  }
  // Recargar para volver al splash
  location.reload();
});
</script>
</body>
</html>
